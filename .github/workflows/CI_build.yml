name: CI_build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Check JSON and JavaScript files
      run: |
        for f in manifest.json _locales/*/messages.json; do
          node -e "JSON.parse(require('fs').readFileSync('$f', 'utf8'))" || exit 1
        done
        for f in *.js; do
          node --check "$f" || exit 1
        done

    - name: Check that the tag matches the manifest version
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        version=$(node -p "require('./manifest.json').version")
        if [ "v$version" != "${{ github.ref_name }}" ]; then
          echo "Tag ${{ github.ref_name }} does not match manifest version $version"
          exit 1
        fi

    - name: Zip the extension
      run: zip -r SpeechExtension_${{ github.ref_name }}.zip manifest.json *.js *.html *.css _locales icons LICENSE README.md

    - name: Archive artifact
      uses: actions/upload-artifact@v7
      with:
          name: SpeechExtension_${{ github.ref_name }}.zip
          path: SpeechExtension_${{ github.ref_name }}.zip

    - name: Create release on tagging
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: SpeechExtension_${{ github.ref_name }}.zip
